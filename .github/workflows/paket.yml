name: Booth · Installationspaket

# Baut die Desktop-Hülle und hängt sie an eine GitHub-Release. Der Tag heißt
# `v<Fassung>` — nicht, weil das schöner wäre, sondern weil `electron-builder`
# genau dorthin veröffentlicht. Ein eigener Name hier hätte bedeutet, dass die
# Download-Seite auf eine Release zeigt, die es nicht gibt.
#
# Genau diese
# Release ist zugleich die Quelle der Selbstaktualisierung: `electron-updater`
# in der installierten App fragt dieselbe Liste ab. Eine zweite Ablage für
# Installer gibt es deshalb bewusst nicht — zwei Listen laufen auseinander,
# und die Box lädt dann die falsche Fassung.

on:
  # Der Tag ist der saubere Auslöser. Daneben der Zweig, auf dem gearbeitet
  # wird: Ein Tag lässt sich nicht aus jeder Umgebung heraus setzen, und ein
  # Installer, der nur bei perfekten Bedingungen entsteht, entsteht nie.
  # `electron-builder` legt die Release zur Fassung aus `booth/package.json`
  # selbst an — der Tag entsteht dabei, statt vorher gesetzt werden zu müssen.
  push:
    tags: ['v*']
    branches: ['claude/**']
    paths:
      - 'booth/**'
      - '.github/workflows/paket.yml'
  workflow_dispatch:
    inputs:
      fassung:
        description: 'Fassung, z. B. 1.0.0 — leer heißt: die aus booth/package.json'
        required: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: booth/package-lock.json

      - name: Abhängigkeiten holen
        working-directory: booth
        run: npm ci

      - name: Fassung setzen
        if: inputs.fassung != ''
        working-directory: booth
        run: npm version ${{ inputs.fassung }} --no-git-tag-version --allow-same-version

      - name: Oberfläche bauen
        working-directory: booth
        run: npm run build

      # Ohne Codesigning-Zertifikat warnt SmartScreen beim ersten Start.
      # Sobald eines vorliegt: als Secret hinterlegen und hier setzen
      # (CSC_LINK, CSC_KEY_PASSWORD) — electron-builder signiert dann selbst.
      # Zwei Dinge müssen VOR dem Bau stimmen, sonst geht das Veröffentlichen
      # schief — beides gemessen, nicht vermutet:
      #
      #  1. GitHub nimmt eine öffentliche Release nur mit einem echten Tag an
      #     („Published releases must have a valid tag", 422). Beim Bau aus
      #     einem Zweig gibt es den noch nicht.
      #  2. `electron-builder` startet je Datei einen Veröffentlicher. Finden
      #     die gleichzeitig keine Release, legt JEDER eine an — und zwei
      #     Releases mit demselben Tag machen die Adresse
      #     `/releases/download/<tag>/…` mehrdeutig: Sie antwortet mit 404,
      #     obwohl die Datei da ist. Genau so ist v1.0.1 gelandet.
      #
      # Also: Tag setzen, alte Releases zu diesem Tag wegräumen, GENAU EINE
      # anlegen. Danach hat electron-builder nichts mehr zu entscheiden.
      - name: Tag und Release vorbereiten
        working-directory: booth
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FASSUNG=$(node -p "require('./package.json').version")
          TAG="v$FASSUNG"
          REPO="${{ github.repository }}"
          echo "Fassung: $FASSUNG"

          git config user.name "youbooth Paketbau"
          git config user.email "noreply@youbooth.me"
          git tag -f "$TAG"
          git push -f origin "$TAG"

          # Alle Releases zu diesem Tag entfernen — auch doppelte.
          for ID in $(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                        "https://api.github.com/repos/$REPO/releases?per_page=100" \
                      | node -e "let t='';process.stdin.on('data',d=>t+=d).on('end',()=>console.log(JSON.parse(t).filter(r=>r.tag_name===process.argv[1]).map(r=>r.id).join(' ')))" "$TAG"); do
            echo "Alte Release $ID entfernen"
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/$ID"
          done

          echo "Release $TAG anlegen"
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"youbooth $FASSUNG\",\"draft\":false,\"prerelease\":false,\"body\":\"Installationspaket für Windows. Die installierte App aktualisiert sich danach selbst.\"}" \
            -o /dev/null -w "  angelegt (%{http_code})\n"

      - name: Installer bauen und veröffentlichen
        working-directory: booth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      # Auch ohne Release zum Mitnehmen: Wer den Lauf von Hand startet, will
      # das Ergebnis oft ansehen, bevor eine Release entsteht.
      - name: Paket am Lauf ablegen
        uses: actions/upload-artifact@v4
        with:
          name: youbooth-windows
          path: |
            booth/paket/*.exe
            booth/paket/*.blockmap
            booth/paket/latest.yml
          if-no-files-found: error
