# PUNKT veröffentlichen
#
# Liefert die Marketingseite auf die bestehende Wix-Site „QR Code"
# (710946fa-e37e-43d7-9f1e-0db6bec22300, punkt-954d3e9b-hnvrme.wix-site-host.com).
#
# Läuft nur auf Knopfdruck, nie von allein — ein Deploy ersetzt hier eine
# veröffentlichte Seite und soll eine Entscheidung sein.
#
# Voraussetzungen:
#   1. Das Geheimnis WIX_API_KEY (steht bereits, wird von Get in Touch benutzt).
#   2. Die Kennungen in punkt/wix.config.json. Beide stehen; woher die
#      appId stammt, erklaert punkt/README.md. Der erste Schritt prueft
#      sie, damit ein leeres oder verstelltes Feld nicht in einem Deploy
#      an der falschen Stelle endet.
#
# Was ausgeliefert wird, liegt NICHT in punkt/, sondern in website/src.
# punkt/ ist nur die Hülle: astro.config.mjs zeigt mit srcDir dorthin.
# Zwei Kopien derselben Seite laufen auseinander.
#
# Was dabei verschwindet: /studio, /zentrale, /lesbarkeit, /massenanlage
# und /schnittstelle des alten Standes werden ersetzt. Die letzten drei
# sind im neuen Entwurf nachgebaut, die ersten beiden nicht — sie sind
# die Anwendung, und die läuft inzwischen im Go-Programm unter pnkt/.

name: PUNKT veröffentlichen

on:
  workflow_dispatch:
    inputs:
      grund:
        description: Warum wird veröffentlicht?
        required: false
        default: Neuer Stand

permissions:
  contents: read

jobs:
  veroeffentlichen:
    name: Bauen und ausliefern
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: punkt

    steps:
      - uses: actions/checkout@v4

      # Zuerst, vor allem anderen: ohne appId endet der Lauf hier — nach
      # zehn Sekunden und mit einem Satz, der sagt, was zu tun ist.
      - name: Kennungen prüfen
        run: node skripte/kennung-pruefen.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            punkt/package-lock.json
            website/package-lock.json

      - name: Abhängigkeiten
        run: npm ci

      # Auch die Abhängigkeiten von website/, obwohl dort nichts gebaut
      # wird. Grund: srcDir zeigt dorthin, und Vite liest beim Übersetzen
      # die tsconfig.json neben den Quellen. Die erweitert
      # `astro/tsconfigs/strict` — das wird aus website/node_modules
      # aufgelöst, nicht aus punkt/node_modules.
      #
      # Lokal fällt das nie auf, weil dort schon installiert ist. In CI
      # bricht der Bau ab mit „Cannot find module
      # astro/tsconfigs/strict/tsconfig.json".
      - name: Abhängigkeiten der Quellen
        run: npm ci
        working-directory: website

      # `wix login --api-key` nimmt den Schlüssel entgegen, fällt in einer
      # Umgebung ohne Terminal aber trotzdem auf die Anmeldung per Gerätecode
      # zurück und wartet dort bis zum Zeitablauf (CLI 1.1.237). Deshalb wird
      # die Datei geschrieben, die das CLI nach erfolgreicher Anmeldung selbst
      # anlegt — gleiche Felder, gleiche Stelle. Gleicher Kniff wie bei
      # Get in Touch; fällt weg, sobald --api-key ohne Terminal durchläuft.
      - name: Anmelden
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          if [ -z "$WIX_API_KEY" ]; then
            echo "::error::Das Geheimnis WIX_API_KEY fehlt."
            exit 1
          fi
          konto=$(curl -sS --fail "https://www.wixapis.com/accounts/v1/accounts/my_account" \
                    -H "Authorization: $WIX_API_KEY")
          mkdir -p ~/.wix/auth
          WIX_API_KEY="$WIX_API_KEY" KONTO="$konto" node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { homedir } from "node:os";
            import { resolve } from "node:path";
            const { account } = JSON.parse(process.env.KONTO);
            writeFileSync(
              resolve(homedir(), ".wix/auth/api-key.json"),
              JSON.stringify({
                token: process.env.WIX_API_KEY,
                accountId: account.accountId,
                userInfo: { userId: account.accountOwner, email: account.slug },
              }),
              { mode: 0o600 },
            );
          '
          npx wix whoami

      # Die Anbindung @wix/astro liest beim Bauen WIX_CLIENT_ID und
      # weitere Projektwerte. Lokal stehen sie in .env.local, das zu Recht
      # nicht im Repository liegt — es enthält ein Client-Geheimnis. Hier
      # werden sie nach der Anmeldung von Wix geholt.
      #
      # Der erste Anlauf lief ohne die Anbindung und damit ohne diesen
      # Schritt. Er baute sauber durch und scheiterte beim Ausliefern:
      #
      #   ✖ Project build output is missing.
      #   ⚠ ".wix/build-metadata.json" build output file is missing.
      #
      # Nachgesehen im CLI: `wix release` verlangt diese Datei, und
      # geschrieben wird sie im Hook `astro:build:done` von @wix/astro.
      # Ohne die Anbindung entsteht sie nie.
      # Die Regeln, die ohne Wix pruefbar sind: Kuerzelform,
      # Passwortstreuung, Sitzungsausweis. Laeuft vor dem Bau, damit ein
      # verstellter Grenzwert nicht erst auf der ausgelieferten Seite
      # auffaellt.
      - name: Regeln pruefen
        run: npm test

      - name: Projektwerte holen
        run: npx wix env pull

      # VORSCHAU=1: Riegel oben und noindex. Die alte Seite trug an
      # derselben Stelle ein noindex, solange Pflichtangaben fehlten —
      # und sie fehlen weiter. Ohne diese Zeile war die erste
      # Auslieferung indexierbar, mit einem Impressum aus Platzhaltern.
      # Wegnehmen, sobald Impressum und Datenschutz stehen.
      # Der Kern der Werkstatt. Er liegt nicht im Repository — er entsteht
      # aus pnkt/ und waere sonst eine 3,4-MB-Binaerdatei im Verlauf, die
      # sich bei jedem Bau aendert. wasm_exec.js kommt aus derselben
      # Go-Installation und gehoert zu genau dieser Version.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Kern nach WebAssembly übersetzen
        run: sh skripte/wasm-bauen.sh
        working-directory: website

      - name: Bauen
        run: npm run build
        env:
          # PUBLIC_ ist Pflicht, nicht Geschmack: nur diese Variablen
          # ersetzt Vite beim Bauen. Ohne das Präfix wird die Zeile im
          # Layout erst beim Aufruf ausgewertet — auf dem Wix-Server,
          # wo nichts gesetzt ist. Genau so lief der erste Versuch: Bau
          # mit VORSCHAU=1, ausgelieferte Seite ohne noindex.
          PUBLIC_VORSCHAU: '1'
          VORSCHAU: '1'
          # Nur hier gibt es eine Laufzeit, die /anmelden und /zentrale
          # beantwortet. Die statische Fassung zeigt den Knopf deshalb
          # nicht — ein Anmeldeknopf, der 404 gibt, war der Anfang
          # dieser ganzen Runde.
          PUBLIC_DYNAMISCH: '1'

      - name: Ausliefern
        run: npm run release

      - name: Erreichbarkeit nachsehen
        run: |
          basis="${{ vars.PUNKT_URL || 'https://punkt-954d3e9b-hnvrme.wix-site-host.com' }}"
          fehler=0
          for pfad in "" "/werkstatt" "/strecken" "/vorlagen" "/preise" \
                      "/lesbarkeit" "/massenanlage" "/schnittstelle" \
                      "/datenschutz" "/impressum" "/studio" "/serie" \
                      "/system" "/anmelden"; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' "$basis$pfad" || echo 000)
            echo "$code  $pfad"
            [ "$code" = "200" ] || fehler=1
          done
          # Die Schrift muss mitkommen. Fehlt sie, sieht die Seite auf den
          # ersten Blick richtig aus und setzt in Wahrheit die Systemschrift.
          code=$(curl -sSL -o /dev/null -w '%{http_code}' "$basis/schrift/caprasimo-400-latin.woff2" || echo 000)
          echo "$code  /schrift/caprasimo-400-latin.woff2"
          [ "$code" = "200" ] || fehler=1

          # Ohne den Kern zeigt die Werkstatt eine leere Vorschau und
          # sonst nichts. Er ist die Anwendung, nicht ein Beiwerk.
          code=$(curl -sSL -o /dev/null -w '%{http_code}' "$basis/wasm/pnkt.wasm" || echo 000)
          echo "$code  /wasm/pnkt.wasm"
          [ "$code" = "200" ] || fehler=1

          # /zentrale ohne Ausweis gehoert auf /anmelden. Eine 200 hier
          # hiesse, dass fremde Codes offen liegen.
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$basis/zentrale" || echo 000)
          echo "$code  /zentrale (ohne Ausweis, erwartet 302)"
          [ "$code" = "302" ] || fehler=1

          exit $fehler
