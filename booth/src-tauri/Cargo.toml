[package]
name = "youbooth"
version = "0.1.0"
description = "youbooth — Fotobox-Software"
authors = ["youbooth"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "youbooth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Kleiner HTTP-Server, damit Gaeste die Aufnahme ueber den Hotspot der Box
# laden koennen — ohne Internet, ohne Cloud.
tiny_http = "0.12"
local-ip-address = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
