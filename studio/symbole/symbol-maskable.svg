<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Werkbank</title>
  <!-- Maskierbare Fassung: dieselbe Form, aber auf 60 % der Kantenlänge
       zusammengezogen. Android schneidet je nach Gerät einen Kreis, ein
