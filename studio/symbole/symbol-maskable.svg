  <g transform="translate(184 178)">
    <path d="M0 0 H98.6 L149.5 55.4 V184.7 H0 Z" fill="#0F766E"/>
    <path d="M98.6 0 L149.5 55.4 H98.6 Z" fill="#7FD6CD"/>
  </g>
</svg>
