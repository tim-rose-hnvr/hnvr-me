<!DOCTYPE html>
<html lang="de" data-thema="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Werkbank — PDF</title>
<link rel="stylesheet" href="app/stil.css">
</head>
<body>

<div id="huelle" class="huelle" hidden>

  <header class="kopf">
    <div class="kopf-links">
      <button class="knopf knopf-still" id="knopf-seitenleiste" title="Seitenleiste (F4)" aria-label="Seitenleiste">
        <svg viewBox="0 0 24 24" class="sinnbild"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
      <div class="titel">
        <strong id="titel-name">Ohne Titel</strong>
        <span class="titel-zusatz" id="titel-zusatz"></span>
      </div>
    </div>

    <div class="kopf-mitte" id="werkzeugleiste" role="toolbar" aria-label="Werkzeuge"></div>

    <div class="kopf-rechts">
      <button class="knopf knopf-still" id="knopf-befehle" title="Befehle (Strg+K)">
        <svg viewBox="0 0 24 24" class="sinnbild"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
        <span class="nur-breit">Befehle</span>
      </button>
      <button class="knopf" id="knopf-sichern" title="Sichern (Strg+S)">
        <svg viewBox="0 0 24 24" class="sinnbild"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7V3"/><rect x="8" y="13" width="8" height="8"/></svg>
        <span class="nur-breit">Sichern</span>
      </button>
    </div>
  </header>

  <div class="rumpf">

    <aside class="leiste leiste-links" id="leiste-links">
      <nav class="reiter" id="reiter-links" role="tablist">
        <button class="reiter-knopf ist-aktiv" data-tafel="miniaturen" role="tab">Seiten</button>
        <button class="reiter-knopf" data-tafel="gliederung" role="tab">Gliederung</button>
        <button class="reiter-knopf" data-tafel="suche" role="tab">Suche</button>
        <button class="reiter-knopf" data-tafel="anmerkungen" role="tab">Notizen</button>
      </nav>
      <div class="tafel ist-aktiv" data-tafel="miniaturen" id="tafel-miniaturen"></div>
      <div class="tafel" data-tafel="gliederung" id="tafel-gliederung"></div>
      <div class="tafel" data-tafel="suche" id="tafel-suche"></div>
      <div class="tafel" data-tafel="anmerkungen" id="tafel-anmerkungen"></div>
    </aside>

    <main class="buehne" id="buehne" tabindex="0">
      <div class="spur" id="spur"></div>
    </main>

    <aside class="leiste leiste-rechts" id="leiste-rechts">
      <div class="tafel ist-aktiv" id="tafel-rechts"></div>
    </aside>

  </div>

  <footer class="fuss">
    <div class="fuss-gruppe">
      <button class="knopf knopf-klein knopf-still" id="knopf-zurueck" title="Vorherige Seite">◂</button>
      <input class="feld feld-schmal" id="feld-seite" value="1" aria-label="Seitenzahl" inputmode="numeric">
      <span class="leise">von <span id="anzeige-seitenzahl">–</span></span>
      <button class="knopf knopf-klein knopf-still" id="knopf-vor" title="Nächste Seite">▸</button>
    </div>
    <div class="fuss-gruppe" id="fuss-melder"></div>
    <div class="fuss-gruppe">
      <button class="knopf knopf-klein knopf-still" id="knopf-kleiner" title="Kleiner (Strg+−)">−</button>
      <select class="feld" id="feld-zoom" aria-label="Vergrößerung">
        <option value="breite">Breite</option>
        <option value="seite">Ganze Seite</option>
        <option value="0.5">50 %</option>
        <option value="0.75">75 %</option>
        <option value="1">100 %</option>
        <option value="1.25">125 %</option>
        <option value="1.5">150 %</option>
        <option value="2">200 %</option>
        <option value="4">400 %</option>
      </select>
      <button class="knopf knopf-klein knopf-still" id="knopf-groesser" title="Größer (Strg++)">+</button>
      <button class="knopf knopf-klein knopf-still" id="knopf-drehen" title="Ansicht drehen (Strg+Umschalt+R)">
        <svg viewBox="0 0 24 24" class="sinnbild"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 4 21 10 15 10"/></svg>
      </button>
      <button class="knopf knopf-klein knopf-still" id="knopf-thema" title="Hell / Dunkel">◐</button>
    </div>
  </footer>

</div>

<div id="empfang" class="empfang">
  <div class="empfang-karte">
    <svg viewBox="0 0 24 24" class="empfang-zeichen"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v5h4"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></svg>
    <h1>Werkbank</h1>
    <p class="leise">PDF öffnen, bearbeiten, kommentieren, unterschreiben, ausgeben.<br>
       Läuft vollständig im Browser — nichts verlässt dieses Gerät.</p>
    <div class="empfang-knoepfe">
      <button class="knopf knopf-gross" id="knopf-oeffnen">Datei öffnen</button>
      <button class="knopf knopf-gross knopf-still" id="knopf-beispiel">Beispiel laden</button>
    </div>
    <p class="leise klein">Oder Datei hierher ziehen · Strg+O</p>
  </div>
</div>

<div id="ablegeschirm" class="ablegeschirm" hidden><div>Loslassen zum Öffnen</div></div>

<input type="file" id="dateiwahl" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="dateiwahl-anhang" accept="application/pdf,.pdf" hidden>
<input type="file" id="dateiwahl-vergleich" accept="application/pdf,.pdf" hidden>

<div id="schirm" class="schirm" hidden></div>
<div id="meldungen" class="meldungen" aria-live="polite"></div>
<div id="lader" class="lader" hidden><div class="lader-balken"><i></i></div><span id="lader-text">Wird geladen …</span></div>

<script type="module" src="app/main.js"></script>
<noscript><p style="padding:2rem">Diese Anwendung braucht JavaScript.</p></noscript>
</body>
</html>
